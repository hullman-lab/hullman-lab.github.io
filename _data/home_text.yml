- As impressive new AI capabilities emerge, we need new methods for appraising and combining human and artificial intelligence.
- <em><strong>Statistical foundations for multi-agent decision-making.</strong></em> Models present us with new inputs to important decisions, but how do we pinpoint and design for the complementary strengths of different agents working together on complex decision problems?
- <em><strong>Beliefs, explanations, and uncertainty.</strong></em> How do we know what a model knows? How do we teach it to explain itself well? How do we quantify uncertainty in its outputs in principled and human aligned ways?
- <em><strong>AI for science.</strong></em> How should behavioral science methods be adapted to allow for use of LLM simulations? What are the risks to scientific progress of AI-automated production and evaluation of research?
- Our lab has received numerous paper awards and PhDs have gone on to tenure track faculty positions at highly ranked CS departments. If you're obsessed with doing rigorous work on these topics, consider applying to work with the lab.
